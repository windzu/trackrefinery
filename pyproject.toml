[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "trackrefinery"
version = "0.1.0.dev0"
description = "Single-instance, multi-frame 3D object geometry and pose refinement"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "TrackRefinery contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
geometric = [
  "scipy>=1.10",
]
review = [
  "matplotlib>=3.8",
  "plotly>=5.24",
]
dev = [
  "build>=1.2",
  "matplotlib>=3.8",
  "plotly>=5.24",
  "pytest>=8.0",
  "ruff>=0.6",
  "scipy>=1.10",
]

[project.scripts]
trackrefinery = "trackrefinery.cli:main"
trackrefinery-validate = "trackrefinery.cli:validate_main"
trackrefinery-validate-targets = "trackrefinery.cli:validate_targets_main"
trackrefinery-generate-synthetic = "trackrefinery.synthetic:main"
trackrefinery-evaluate = "trackrefinery.cli:evaluate_main"
trackrefinery-evaluate-suite = "trackrefinery.cli:evaluate_suite_main"
trackrefinery-build-review = "trackrefinery.cli:build_review_main"
trackrefinery-review = "trackrefinery.cli:review_main"

[project.urls]
Homepage = "https://github.com/windzu/trackrefinery"
Repository = "https://github.com/windzu/trackrefinery"
Issues = "https://github.com/windzu/trackrefinery/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/trackrefinery"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
